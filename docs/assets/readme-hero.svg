<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">News source-grounded event memory system preview</title>
  <desc id="desc">A dashboard-style preview showing sources flowing into articles, claims, story memory, briefing output, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="0.48" stop-color="#17202a"/>
      <stop offset="1" stop-color="#0f2526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51d6b8"/>
      <stop offset="1" stop-color="#f2c166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="180" fill="#51d6b8" opacity="0.08"/>
  <circle cx="160" cy="580" r="210" fill="#f2c166" opacity="0.07"/>

  <g transform="translate(70 68)">
    <rect width="1060" height="494" rx="28" fill="#f7f4ec" filter="url(#shadow)"/>
    <rect x="24" y="24" width="1012" height="446" rx="18" fill="#ffffff"/>

    <g transform="translate(56 54)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#267a68">NEWS</text>
      <text x="0" y="48" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#151922">Source-grounded</text>
      <text x="0" y="102" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#151922">event memory</text>
      <rect x="0" y="132" width="352" height="6" rx="3" fill="url(#accent)"/>
      <text x="0" y="176" font-family="Inter, Arial, sans-serif" font-size="22" fill="#48515c">Track real stories over time.</text>
      <text x="0" y="208" font-family="Inter, Arial, sans-serif" font-size="22" fill="#48515c">Show what changed today.</text>
      <text x="0" y="240" font-family="Inter, Arial, sans-serif" font-size="22" fill="#48515c">Keep every claim auditable.</text>

      <g transform="translate(0 296)">
        <rect width="154" height="42" rx="21" fill="#e6f7f2"/>
        <text x="20" y="27" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#267a68">SQLite memory</text>
        <rect x="170" width="142" height="42" rx="21" fill="#fff3d7"/>
        <text x="190" y="27" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a5a08">LLM telemetry</text>
        <rect x="328" width="118" height="42" rx="21" fill="#eaf0ff"/>
        <text x="348" y="27" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#3453a3">85 tests</text>
      </g>
    </g>

    <g transform="translate(560 54)">
      <rect width="420" height="360" rx="20" fill="#151922"/>
      <rect x="22" y="24" width="376" height="58" rx="12" fill="#222936"/>
      <text x="42" y="58" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Daily intelligence briefing</text>

      <g transform="translate(22 104)">
        <rect width="116" height="78" rx="14" fill="#263241"/>
        <text x="18" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#8debd6">Sources</text>
        <text x="18" y="54" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">442</text>

        <rect x="132" width="116" height="78" rx="14" fill="#263241"/>
        <text x="150" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffd783">Claims</text>
        <text x="150" y="54" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">1593</text>

        <rect x="264" width="112" height="78" rx="14" fill="#263241"/>
        <text x="282" y="28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#a7b9ff">Stories</text>
        <text x="282" y="54" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">250</text>
      </g>

      <g transform="translate(22 212)">
        <rect width="376" height="112" rx="14" fill="#f7f4ec"/>
        <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#151922">Gaza flotilla raid</text>
        <text x="18" y="58" font-family="Inter, Arial, sans-serif" font-size="14" fill="#596272">What changed today: adjacent detention</text>
        <text x="18" y="80" font-family="Inter, Arial, sans-serif" font-size="14" fill="#596272">abuse reporting rejected as same event.</text>
        <rect x="260" y="24" width="92" height="30" rx="15" fill="#ffe8d7"/>
        <text x="279" y="44" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9b4a12">REJECTED</text>
      </g>
    </g>

    <g transform="translate(110 445)">
      <rect width="150" height="38" rx="19" fill="#151922"/>
      <text x="42" y="25" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Source</text>
      <path d="M260 19 H336" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>
      <rect x="336" width="150" height="38" rx="19" fill="#151922"/>
      <text x="382" y="25" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Article</text>
      <path d="M486 19 H562" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>
      <rect x="562" width="150" height="38" rx="19" fill="#151922"/>
      <text x="604" y="25" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Claim</text>
      <path d="M712 19 H788" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>
      <rect x="788" width="150" height="38" rx="19" fill="#151922"/>
      <text x="830" y="25" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Briefing</text>
    </g>
  </g>
</svg>
