[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_configs = true

# Typed-core ratchet (docs/coding-standard.md, Type Hints): modules listed
# here reject untyped and partially typed defs. Annotate a module fully,
# then add it. The list only grows.
[[tool.mypy.overrides]]
module = [
    "src.config",
    "src.pricing",
    "src.llm_response_cache",
    "src.article_dates",
    "src.observability.database",
    "src.observability.state",
    "src.tracker.occurrences",
    "src.tracker.replay",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
