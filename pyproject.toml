[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-memory"
version = "0.1.0"
description = "Local source-grounded news memory powered by Codex exec"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[project.scripts]
news = "news.cli:main"

[tool.setuptools.packages.find]
include = ["news*"]

[tool.setuptools.package-data]
news = ["tasks/*.md", "tasks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
